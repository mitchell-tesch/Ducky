description: >
  DuckDB integration for Grasshopper. Open in-memory or file-backed databases, load CSV/JSON/Parquet/Excel and Grasshopper data trees, query in SQL, export results, and round-trip Rhino geometry through the DuckDB spatial extension. Also provides fast, COM-free direct Excel read/write components for cell- and range-level access to xlsx/xlsm workbooks.
